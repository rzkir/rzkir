name: GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: GitHub Stats
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: "username=rzkir&show_icons=true&theme=transparent&hide_border=true&include_all_commits=true&count_private=true"
          path: assets/stats.svg

      - name: Top Languages
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: "username=rzkir&layout=compact&theme=transparent&hide_border=true&langs_count=8"
          path: assets/top-langs.svg

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/top-langs.svg
          git diff --cached --quiet || (git commit -m "chore: update github stats" && git push)
