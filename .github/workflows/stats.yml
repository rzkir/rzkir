name: GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stats.yml"

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch GitHub Stats
        run: |
          curl -fsSL "https://github-readme-stats-eight-theta.vercel.app/api?username=rzkir&show_icons=true&theme=transparent&hide_border=true&include_all_commits=true&count_private=true" \
            -o assets/stats.svg
          curl -fsSL "https://github-readme-stats-eight-theta.vercel.app/api/top-langs/?username=rzkir&layout=compact&theme=transparent&hide_border=true&langs_count=8" \
            -o assets/top-langs.svg
          curl -fsSL "https://streak-stats.demolab.com/?user=rzkir&theme=transparent&hide_border=true" \
            -o assets/streak.svg
          # Remove stray "undefined" text node from some vercel builds
          sed -i '/^[[:space:]]*undefined[[:space:]]*$/d' assets/stats.svg assets/top-langs.svg

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/top-langs.svg assets/streak.svg
          git diff --cached --quiet || (git commit -m "chore: update github stats" && git push)
